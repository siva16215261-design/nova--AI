
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA AI - Chat</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #0b1020;
  color: white;
  font-family: Arial, sans-serif;
}
header {
  background: #151d35;
  padding: 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #293657;
}
.logo {
  color: #65b8ff;
  font-size: 25px;
  font-weight: bold;
}
#newChat {
  background: #283957;
  color: white;
  border: 1px solid #405779;
  border-radius: 8px;
  padding: 10px;
}
main {
  max-width: 850px;
  margin: auto;
  padding: 20px;
}
h1 { text-align: center; }
.subtitle {
  text-align: center;
  color: #aab8d3;
}
#chat {
  margin-top: 25px;
  min-height: 300px;
  max-height: 55vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.message {
  padding: 13px 16px;
  border-radius: 14px;
  max-width: 85%;
  line-height: 1.5;
  overflow-wrap: anywhere;
}
.user {
  background: #2769c9;
  align-self: flex-end;
}
.bot {
  background: #202d49;
  align-self: flex-start;
}
.inputArea {
  display: flex;
  gap: 8px;
  margin-top: 20px;
}
input {
  flex: 1;
  min-width: 0;
  padding: 14px;
  border-radius: 10px;
  border: 1px solid #405779;
  background: #18233d;
  color: white;
  font-size: 16px;
}
button {
  cursor: pointer;
  border: none;
  border-radius: 10px;
  background: #397eea;
  color: white;
  padding: 12px 17px;
}
footer {
  text-align: center;
  padding: 25px;
  color: #8292ae;
  font-size: 12px;
}
</style>
</head>
<body>
<header>
  <div class="logo">✦ NOVA AI</div>
  <button id="newChat">＋ New Chat</button>
</header>

<main>
  <h1>Welcome to NOVA Chat</h1>
  <p class="subtitle">Your personal AI assistant</p>

  <div id="chat" aria-live="polite">
    <div class="message bot">
      Hello! 👋 Welcome to NOVA AI. What can I help you with today?
    </div>
  </div>

  <div class="inputArea">
    <input id="messageInput"
      type="text"
      placeholder="Ask NOVA anything..."
      aria-label="Your message">
    <button id="sendButton">Send ➤</button>
  </div>
</main>

<footer>
  NOVA AI © 2026 | Your AI world
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");

function sendMessage() {
  const message = input.value.trim();
  if (!message) return;

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = message;
  chat.appendChild(userMessage);

  input.value = "";
  chat.scrollTop = chat.scrollHeight;

  const reply = document.createElement("div");
  reply.className = "message bot";
  reply.textContent =
    "I received your message! My real AI brain will be connected in NOVA AI Lesson 5. 🚀";
  chat.appendChild(reply);

  chat.scrollTop = chat.scrollHeight;
}

document.getElementById("sendButton")
  .addEventListener("click", sendMessage);

input.addEventListener("keydown", function(event) {
  if (event.key === "Enter") sendMessage();
});

document.getElementById("newChat")
  .addEventListener("click", function() {
    chat.innerHTML = "";
    const welcome = document.createElement("div");
    welcome.className = "message bot";
    welcome.textContent = "New conversation started! Hello 👋";
    chat.appendChild(welcome);
  });
</script>
</body>
</html>
